<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Twitter Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="header">
      <h1>Twitter Blocker</h1>
      <div class="status" data-i18n="statusBlocked"></div>
    </div>
    
    <div class="section">
      <h2 class="section-title" data-i18n="popupUnblockTitle"></h2>
      
      <div class="quick-actions">
        <button class="quick-button" data-minutes="5"></button>
        <button class="quick-button" data-minutes="10"></button>
        <button class="quick-button" data-minutes="15"></button>
        <button class="quick-button" data-minutes="30"></button>
      </div>
      
      <div class="duration-grid">
        <div class="time-input-container">
          <div class="time-input-wrapper">
            <input type="number" id="minuteInput" min="1" max="120" value="5" data-i18n-aria="popupMinutesAria" />
            <span class="time-unit" data-i18n="popupUnit"></span>
          </div>
        </div>
        <button id="saveButton" class="primary-button" data-i18n-aria="popupUnblockAria" data-i18n="popupUnblockButton">
        </button>
      </div>
    </div>
    
    <div class="section">
      <h2 class="section-title" data-i18n="popupRedirectTitle"></h2>
      
      <div style="margin-bottom: 12px;">
        <label class="redirect-label" data-i18n="popupRedirectLabel"></label>
        <input 
          type="url" 
          id="redirectUrlInput" 
          placeholder="https://example.com"
        />
      </div>
      
      <button id="saveUrlButton" data-i18n="popupSaveUrl"></button>
      
      <div id="urlStatus" data-i18n="urlSaved"></div>
    </div>
    
    <script src="popup.js"></script>
  </body>
</html>
